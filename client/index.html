<!doctype html>
<html lang="en" class="light">
  <head>

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/json" href="/manifest.json" />

    <!-- Favicon & Touch Icons -->

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f6f0" />

    <meta name="twitter:title" content="Alterjot — Distraction-Free Manuscript Studio" />
    <meta name="twitter:description" content="A distraction-free manuscript studio for novelists, worldbuilders, and storytellers." />
