<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark rounded canvas background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>

    <!-- Warm emblem 3D gradient -->
    <linearGradient id="emblemGrad" x1="18%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#ff9a3d" />
      <stop offset="28%" stop-color="#ff6b00" />
      <stop offset="65%" stop-color="#e54e00" />
      <stop offset="100%" stop-color="#8f2400" />
    </linearGradient>

    <!-- Highlight stroke gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#ffb84d" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Nib metallic gradient -->
    <linearGradient id="nibGrad" x1="30%" y1="20%" x2="85%" y2="80%">
      <stop offset="0%" stop-color="#ffb03a" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#5c1a05" />
    </linearGradient>

    <!-- Chevron gradient -->
    <linearGradient id="chevronGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7" />
      <stop offset="50%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Glowing nib tip flare -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="1" />
      <stop offset="20%" stop-color="#fde047" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#ea580c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient glow filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ea580c" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Background Container with subtle amber border -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="#ff7700" stroke-width="2" stroke-opacity="0.2" filter="url(#amberGlow)" />

  <!-- Centered Alterjot Alpha-Pen Emblem -->
  <g transform="translate(68, 68) scale(3.76)" filter="drop-shadow(0 4px 10px rgba(234, 88, 12, 0.4))">
    <!-- Spur / lower right foot -->
    <path d="M 52 64 L 62 76.5 L 67.5 76.5 L 57 60 Z" fill="url(#emblemGrad)" />

    <!-- Main loop of 'a' / 'α' -->
    <path
      d="
        M 36 28
        C 21.6 28, 10 39.6, 10 54
        C 10 68.4, 21.6 80, 36 80
        C 44.5 80, 52 75.8, 56.5 69.5
        L 70 44
        C 67.5 38, 62 33, 54 29.5
        C 49 28.5, 42.5 28, 36 28
        Z
        M 36 41
        C 43.2 41, 49 46.8, 49 54
        C 49 61.2, 43.2 67, 36 67
        C 28.8 67, 23 61.2, 23 54
        C 23 46.8, 28.8 41, 36 41
        Z
      "
      fill="url(#emblemGrad)"
      fill-rule="evenodd"
    />

    <!-- Bevel highlight -->
    <path
      d="
        M 11.5 54
        C 11.5 40.5, 22.5 29.5, 36 29.5
        C 48 29.5, 58 35, 64 42
        L 68.5 36.5
      "
      stroke="url(#highlightGrad)"
      stroke-width="2.2"
      stroke-linecap="round"
      fill="none"
      opacity="0.8"
    />

    <!-- Inner Chevron / Caret -->
    <path
      d="M 30.5 59 L 36 48 L 41.5 59"
      stroke="url(#chevronGrad)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Barrel -->
    <path d="M 54.5 49 L 68 33.5 L 75 40 L 59.5 56.5 Z" fill="url(#emblemGrad)" />

    <!-- Collar -->
    <path d="M 67 32.5 L 76 41" stroke="#fed7aa" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />

    <!-- Fountain Pen Nib -->
    <path
      d="
        M 68 31.5
        L 70.5 24
        C 72.5 21, 77 17.5, 84 13.5
        C 80 20.5, 80 24.5, 82.5 27
        L 75 39.5
        Z
      "
      fill="url(#nibGrad)"
    />

    <!-- Breather hole -->
    <circle cx="76" cy="23" r="1.6" fill="#14171d" stroke="#fde047" stroke-width="0.8" />

    <!-- Slit line -->
    <line x1="76" y1="23" x2="84" y2="13.5" stroke="#14171d" stroke-width="1.1" stroke-linecap="round" />
    <line x1="76" y1="23" x2="83.8" y2="13.7" stroke="#fed7aa" stroke-width="0.5" stroke-linecap="round" opacity="0.8" />

    <!-- Glowing ember at tip -->
    <circle cx="84" cy="13.5" r="14" fill="url(#sparkGlow)" />
    <circle cx="84" cy="13.5" r="3.2" fill="#fde047" />
    <circle cx="84" cy="13.5" r="1.5" fill="#ffffff" />
  </g>
</svg>